spring.application.name=review-parser-v2

review.collection.schedule-interval-seconds=0

review.storage.sources-file=target/test-data/sources.json
review.storage.reviews-file=target/test-data/reviews.json

# Isolated in-memory H2 database for tests
spring.datasource.url=jdbc:h2:mem:review-parser-v2-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
