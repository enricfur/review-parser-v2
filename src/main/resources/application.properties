spring.application.name=review-parser-v2

review.collection.schedule-interval-seconds=60

review.storage.sources-file=data/sources.json
review.storage.reviews-file=data/reviews.json

# Storage mode: json or h2
review.storage.mode=json

# Persistent H2 database
spring.datasource.url=jdbc:h2:file:./data/review-parser-v2-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
